# YourCVPassport - Cabeceras de seguridad comunes (snippet)
#
# Instalar en /etc/nginx/snippets/ e incluir A NIVEL DE server {} (no de location):
#     include snippets/yourcvpassport-security-headers.conf;
#
# IMPORTANTE: nginx NO hereda los add_header del server en una location que declare
# su propio add_header. Por eso ninguna location de yourcvpassport-*.conf usa add_header
# (la caché va por el map $ycp_cache_control). Si alguna vez una location necesita uno,
# tiene que volver a incluir este snippet dentro de esa location.
#
# "always": también en 404, 5xx y redirecciones.
# Mantener sincronizado con SECURITY_HEADERS / CONTENT_SECURITY_POLICY de server.mjs.

# HSTS: 1 año, sin includeSubDomains ni preload hasta confirmar que TODOS los
# subdominios sirven HTTPS (ver nginx/README.md).
add_header Strict-Transport-Security "max-age=31536000" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
# El auditor XSS de navegadores antiguos introducía fugas: se desactiva explícitamente
add_header X-XSS-Protection "0" always;

# CSP en modo Report-Only: los navegadores informan (consola) pero no bloquean.
# Para pasar a enforcing, ver nginx/README.md. Orígenes:
# - script:  Opynio (widget de reseñas, lo inyectan Testimonials.tsx y SuccessStoriesPage.tsx)
# - img:     Storage de Supabase, banderas, imágenes de stock/demo, QR, mapas, GIFs de Tenor,
#            favicons de enlaces (www.google.com/s2/favicons redirige a *.gstatic.com),
#            avatares de instructores alojados en iseie.com y psikoaprende.com
# - connect: Supabase (REST + Realtime), proveedores de traducción, ipify, Tenor,
#            Opynio (y su Edge Function widget-proxy en hvtrrhxeqrsnjxhngdsj.supabase.co)
# - frame:   Google Maps embebido en la página de contacto
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://web.opynio.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://djehzlzombqrzzuchcef.supabase.co https://flagcdn.com https://images.unsplash.com https://picsum.photos https://fastly.picsum.photos https://ui-avatars.com https://images.pexels.com https://via.placeholder.com https://api.qrserver.com https://maps.googleapis.com https://media.tenor.com https://www.google.com https://*.gstatic.com https://iseie.com https://psikoaprende.com; connect-src 'self' https://djehzlzombqrzzuchcef.supabase.co wss://djehzlzombqrzzuchcef.supabase.co https://translate.googleapis.com https://api.mymemory.translated.net https://api.ipify.org https://tenor.googleapis.com https://web.opynio.com https://hvtrrhxeqrsnjxhngdsj.supabase.co; font-src 'self' data:; frame-src https://www.google.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
