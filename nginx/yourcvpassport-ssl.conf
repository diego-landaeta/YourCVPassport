# YourCVPassport - TLS común (snippet)
#
# Instalar en /etc/nginx/snippets/ e incluir en cada server {} que escuche en 443.
# El certificado debe cubrir yourcvpassport.com Y www.yourcvpassport.com (el server
# de www solo redirige al apex, pero el handshake TLS ocurre antes de la redirección).

ssl_certificate /etc/ssl/certs/yourcvpassport.crt;
ssl_certificate_key /etc/ssl/private/yourcvpassport.key;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers HIGH:!aNULL:!MD5;
ssl_prefer_server_ciphers on;
ssl_session_cache shared:YCP_SSL:10m;
ssl_session_timeout 1d;
