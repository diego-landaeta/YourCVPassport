# YourCVPassport - Ajustes comunes de proxy hacia server.mjs (snippet)
#
# Instalar en /etc/nginx/snippets/ e incluir en las location que hacen
# proxy_pass http://nodejs_backend;

proxy_http_version 1.1;
# Conexiones keepalive con el upstream: Connection vacío (server.mjs no usa WebSockets)
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# server.mjs solo confía en proxies de loopback (TRUST_PROXY): toma como IP del cliente
# la última entrada que añade nginx, así que un X-Forwarded-For falseado no evita el
# rate limit de /api/translate.
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# server.mjs también envía estas cabeceras (por si se usa sin nginx). Se ocultan
# para que el navegador no las reciba duplicadas: las pone el snippet de seguridad.
proxy_hide_header X-Powered-By;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header X-XSS-Protection;
proxy_hide_header Content-Security-Policy-Report-Only;
proxy_hide_header Content-Security-Policy;

proxy_connect_timeout 10s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
