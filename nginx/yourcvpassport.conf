# YourCVPassport - Nginx Configuration
# Esta configuración maneja correctamente los códigos de estado 404 para perfiles no encontrados

server {
    listen 80;
    listen [::]:80;
    server_name yourcvpassport.com www.yourcvpassport.com;

    # Redireccionar HTTP a HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourcvpassport.com www.yourcvpassport.com;

    # SSL Configuration (ajusta las rutas según tu certificado)
    ssl_certificate /etc/ssl/certs/yourcvpassport.crt;
    ssl_certificate_key /etc/ssl/private/yourcvpassport.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Root directory donde están los archivos build de React
    root /var/www/yourcvpassport/dist;
    index index.html;

    # Logs
    access_log /var/log/nginx/yourcvpassport-access.log;
    error_log /var/log/nginx/yourcvpassport-error.log;

    # Comprimir archivos para mejor performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Cache para archivos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Assets folder con caché agresivo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # API routes (si usas Supabase edge functions o similar)
    location /api/ {
        # Proxy a tu backend API si es necesario
        # proxy_pass http://localhost:54321;
        # proxy_http_version 1.1;
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection 'upgrade';
        # proxy_set_header Host $host;
        # proxy_cache_bypass $http_upgrade;
    }

    # Bloquear rutas no implementadas o públicas no autorizadas
    location ~ ^/(profiles|perfiles|talent-search)/ {
        return 404;
    }

    location = /talent-search {
        return 404;
    }

    # Manejo especial para rutas de perfiles
    # Esta sección detecta cuando un perfil no existe y retorna 404
    location ~ ^/cv/(.+)$ {
        # Primero intenta servir el archivo directamente
        try_files $uri $uri/ /index.html;

        # Si la página contiene el meta tag de 404, nginx debería retornar 404
        # Nota: Para esto necesitas un módulo adicional o un backend que verifique
        # La solución más simple es que React maneje el 404 en el cliente
        # y nginx solo sirva la SPA

        # Headers de seguridad
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Manejo de la página 404
    location = /404 {
        try_files $uri /index.html;
        internal;
    }

    # Para todas las demás rutas (React Router SPA)
    location / {
        try_files $uri $uri/ /index.html;

        # Headers de seguridad
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval';" always;
    }

    # Archivos especiales
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /sitemap.xml {
        access_log off;
        log_not_found off;
    }

    # Denegar acceso a archivos ocultos
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

