# YourCVPassport - Nginx Configuration con SSR
# nginx sirve la SPA (dist/) y solo pasa a Node (server.mjs) /api/* y las
# peticiones de bots a /cv/:slug (meta tags del perfil).
#
# Requiere los snippets de este directorio en /etc/nginx/snippets/ (ver nginx/README.md):
#   yourcvpassport-ssl.conf, yourcvpassport-security-headers.conf, yourcvpassport-proxy.conf
# Habilitar SOLO uno de los dos sites (este o yourcvpassport-ssr-only.conf): ambos
# definen el upstream y los map.
#
# Canónico: https://yourcvpassport.com (APEX). http y www redirigen ahí con 301.

# Caché por URI (contexto http). Se aplica con un único add_header a nivel de server
# para que ninguna location necesite add_header propio (rompería la herencia de las
# cabeceras de seguridad). Sin "always": las respuestas 404/5xx no se cachean.
map $uri $ycp_cache_control {
    default                 "";
    /index.html             "no-cache";
    # Copias de index.html por ruta publica (dist/precios/index.html...; scripts/generate-static-meta.mjs)
    "~/index\.html$"        "no-cache";
    /sw.js                  "no-cache";
    /sitemap.xml            "public, max-age=3600";
    /robots.txt             "public, max-age=3600";
    # Vite pone hash en el nombre de todo lo que hay en /assets/
    "~^/assets/"            "public, max-age=31536000, immutable";
    # Resto de estáticos de public/ (sin hash): caché corta
    "~*\.(?:css|js|mjs|json|png|jpe?g|gif|ico|svg|webp|avif|woff2?|ttf|otf|eot|webmanifest|xsl)$"  "public, max-age=86400";
}

# Detección de bots/crawlers (sustituye al if anidado con proxy_pass)
map $http_user_agent $ycp_is_bot {
    default 0;
    "~*(bot|crawler|spider|slurp|mediapartners|bingpreview|facebookexternalhit|twitterbot|whatsapp)" 1;
}

# Redirecciones permanentes (contexto http). Mismo listado que routeRedirects en
# config/routeConfig.ts y getRedirectPath en server.mjs: si cambias uno, cambia los tres.
# - Paginas fusionadas con otra (una sola URL por contenido).
# - Enlaces de la version antigua con prefijo de idioma (/es/pricing daba 404).
#   Las rutas conocidas van a su version en espanol; el resto solo pierde el prefijo
#   (nginx >= 0.9 permite usar en el valor la captura con nombre del regex).
map $uri $ycp_redirect {
    default                         "";
    /nosotros/mision                /nosotros;
    /about/mission                  /about;
    /recursos/biblioteca            /profesionales/plantillas;
    /resources/library              /professionals/templates;
    /es                             /;
    /en                             /;
    /es/pricing                     /precios;
    /es/product/overview            /producto/resumen;
    /es/product/stamps              /producto/sellos;
    /es/product/ats                 /producto/ats;
    /es/product/domain              /producto/dominio;
    /es/product/analytics           /producto/analiticas;
    /es/product/ai                  /producto/ia;
    /es/professionals/how           /profesionales/como-funciona;
    /es/professionals/templates     /profesionales/plantillas;
    /es/professionals/help          /profesionales/ayuda;
    /es/companies/search            /empresas/busqueda;
    /es/companies/plans             /empresas/planes;
    /es/companies/integrations      /empresas/integraciones;
    /es/companies/security          /empresas/seguridad;
    /es/resources/blog              /recursos/blog;
    /es/resources/library           /profesionales/plantillas;
    /es/resources/success-stories   /recursos/exito;
    /es/resources/status            /recursos/estado;
    /es/about                       /nosotros;
    /es/about/mission               /nosotros;
    /es/about/press                 /nosotros/prensa;
    /es/about/contact               /nosotros/contacto;
    /es/jobs                        /empleos;
    /es/terms                       /terminos;
    /es/privacy                     /privacidad;
    "~^/(?:es|en)(?<ycp_redirect_rest>/.+)$"  $ycp_redirect_rest;
}

upstream nodejs_backend {
    # Mismo puerto que server.mjs (PORT, 3001 por defecto; HOST 127.0.0.1)
    server 127.0.0.1:3001;
    keepalive 64;
}

# HTTP -> HTTPS (siempre al apex)
server {
    listen 80;
    listen [::]:80;
    server_name yourcvpassport.com www.yourcvpassport.com;
    server_tokens off;

    return 301 https://yourcvpassport.com$request_uri;
}

# HTTPS www -> apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.yourcvpassport.com;
    server_tokens off;

    include snippets/yourcvpassport-ssl.conf;
    include snippets/yourcvpassport-security-headers.conf;

    return 301 https://yourcvpassport.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourcvpassport.com;
    server_tokens off;

    include snippets/yourcvpassport-ssl.conf;

    # Cabeceras de seguridad a nivel de server: llegan a TODO (assets, /404, robots,
    # sitemap, errores). NO usar add_header dentro de las location (ver el snippet).
    include snippets/yourcvpassport-security-headers.conf;
    add_header Cache-Control $ycp_cache_control;

    # Rutas fusionadas y prefijos /es, /en antiguos (map $ycp_redirect). if + return a
    # nivel de server es seguro; conserva la query.
    if ($ycp_redirect) {
        return 301 $ycp_redirect$is_args$args;
    }

    # Root directory
    root /var/www/yourcvpassport/dist;
    index index.html;

    client_max_body_size 1m;

    # Logs
    access_log /var/log/nginx/yourcvpassport-access.log;
    error_log /var/log/nginx/yourcvpassport-error.log;

    # Comprimir archivos (woff/woff2 ya van comprimidos)
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml application/rss+xml application/manifest+json image/svg+xml image/x-icon font/ttf font/otf application/vnd.ms-fontobject;

    # Denegar acceso a archivos ocultos (.env, .git...), salvo /.well-known/ (ACME, etc.).
    # Va antes que las demás location por regex: la primera que coincide gana.
    location ~ /\.(?!well-known/) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Assets con hash de Vite (^~: tiene prioridad sobre las regex)
    location ^~ /assets/ {
        access_log off;
        try_files $uri =404;
    }

    # Resto de estáticos
    location ~* \.(?:js|mjs|css|png|jpe?g|gif|ico|svg|webp|avif|woff2?|ttf|otf|eot)$ {
        access_log off;
        try_files $uri =404;
    }

    # mime.types de nginx no conoce .webmanifest
    location = /site.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    # Bloquear rutas no implementadas o públicas no autorizadas
    location ~ ^/(profiles|perfiles|talent-search)/ {
        return 404;
    }

    location = /talent-search {
        return 404;
    }

    # API de server.mjs (traducción, administración). Sin esto el POST caía en la SPA.
    location /api/ {
        include snippets/yourcvpassport-proxy.conf;
        proxy_pass http://nodejs_backend;
    }

    # Rutas de perfiles: los bots pasan por Node (meta tags del perfil); las personas
    # reciben la SPA directamente. error_page + named location en vez de if+proxy_pass.
    location ^~ /cv/ {
        # Permite que un fallo de Node dentro de @ssr use su propio error_page
        recursive_error_pages on;
        error_page 418 = @ssr;
        if ($ycp_is_bot) {
            return 418;
        }
        try_files $uri /index.html;
    }

    location @ssr {
        include snippets/yourcvpassport-proxy.conf;
        # Preservar el 404 de Node mostrando la SPA con ese código
        proxy_intercept_errors on;
        error_page 404 /404;
        # Si Node no responde, el bot recibe la SPA en vez de un 502
        error_page 502 503 504 = @spa_fallback;
        proxy_pass http://nodejs_backend;
    }

    location @spa_fallback {
        try_files /index.html =503;
    }

    # Manejo de errores desde Node.js
    error_page 404 /404;

    location = /404 {
        try_files $uri /index.html;
    }

    # Para todas las demás rutas
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Archivos especiales
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /sitemap.xml {
        access_log off;
        log_not_found off;
    }
}
