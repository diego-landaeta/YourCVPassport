# YourCVPassport - Nginx Configuration con SSR
# Esta configuración requiere un servidor Node.js que haga SSR y devuelva códigos 404 reales

upstream nodejs_backend {
    server 127.0.0.1:3001;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name yourcvpassport.com www.yourcvpassport.com;

    # Redireccionar HTTP a HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourcvpassport.com www.yourcvpassport.com;

    # SSL Configuration
    ssl_certificate /etc/ssl/certs/yourcvpassport.crt;
    ssl_certificate_key /etc/ssl/private/yourcvpassport.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Root directory
    root /var/www/yourcvpassport/dist;

    # Logs
    access_log /var/log/nginx/yourcvpassport-access.log;
    error_log /var/log/nginx/yourcvpassport-error.log;

    # Comprimir archivos
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Cache para archivos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/yourcvpassport/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Assets folder
    location /assets/ {
        root /var/www/yourcvpassport/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Bloquear rutas no implementadas o públicas no autorizadas
    location ~ ^/(profiles|perfiles|talent-search)/ {
        return 404;
    }

    location = /talent-search {
        return 404;
    }

    # Rutas de perfiles - Proxy a Node.js para SSR y manejo de 404
    location ~ ^/cv/(.+)$ {
        # Detectar si es un bot/crawler
        set $is_bot 0;
        if ($http_user_agent ~* "bot|crawler|spider|slurp|mediapartners|bingpreview|facebookexternalhit|twitterbot|whatsapp") {
            set $is_bot 1;
        }

        # Si es un bot, hacer SSR con Node.js
        if ($is_bot = 1) {
            proxy_pass http://nodejs_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Importante: Preservar el código de estado de Node.js
            proxy_intercept_errors on;
        }

        # Para usuarios normales, servir la SPA
        try_files $uri $uri/ /index.html;

        # Headers de seguridad
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Manejo de errores desde Node.js
    error_page 404 /404;

    location = /404 {
        try_files $uri /index.html;
    }

    # Para todas las demás rutas
    location / {
        try_files $uri $uri/ /index.html;

        # Headers de seguridad
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
    }

    # Archivos especiales
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /sitemap.xml {
        access_log off;
        log_not_found off;
    }

    # Denegar acceso a archivos ocultos
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
