# YourCVPassport - Nginx para PRODUCCIÓN ESTÁTICA (sin proceso Node)
#
# Reproduce lo que hay hoy en /etc/nginx/sites-available/yourcvpassport.com:
#   - raíz /var/www/yourcvpassport.com/public/dist (el `dist/` de `npm run build`, subido tal cual),
#   - /sitemap.xml proxificado a la Edge Function `sitemap` de Supabase,
#   - /api/mail-relay hacia el relé de correo (deploy/mail-relay, pm2 en 127.0.0.1:3917),
#   - mapa de redirecciones 301 $ycp_redirect (mismo listado que yourcvpassport-ssr-only.conf),
#   - caché por URI ($ycp_cache_control, sin cambios) y cabeceras de seguridad de los snippets.
# y añade lo que pide la auditoría SEO del 25/10/2026:
#   - hallazgo 01: 404 REAL para rutas inexistentes sin romper la SPA (ver «LISTA BLANCA» abajo),
#     y `/index.html` y `/<ruta>/index.html` dejan de responder 200 (301 a la URL sin `index.html`);
#   - hallazgo 12: 301 /recursos -> /recursos/blog y /resources -> /resources/blog;
#   - hallazgo 10: compresión Brotli (requiere el módulo ngx_brotli; ver el bloque BROTLI).
#
# NO se puede habilitar a la vez que yourcvpassport-ssr-only.conf ni yourcvpassport-with-ssr.conf:
# los tres definen los mismos `map` ($ycp_cache_control, $ycp_redirect) y el mismo server_name.
# Requiere los snippets de este directorio en /etc/nginx/snippets/:
#   yourcvpassport-ssl.conf y yourcvpassport-security-headers.conf
#   (yourcvpassport-proxy.conf NO se usa aquí: apunta a Node y fija Host $host).
# Procedimiento de prueba, comprobaciones con curl y vuelta atrás: nginx/README-static.md
#
# Canónico: https://yourcvpassport.com (APEX). http y www redirigen ahí con 301.

# ----------------------------------------------------------------------------------------------
# Caché por URI (contexto http). IDÉNTICO a yourcvpassport-ssr-only.conf: las cabeceras de caché
# existentes no cambian. En una respuesta de la SPA servida por el fallback (rewrite a /index.html)
# $uri ya es /index.html, así que también sale `no-cache`.
# ----------------------------------------------------------------------------------------------
map $uri $ycp_cache_control {
    default                 "";
    /index.html             "no-cache";
    # Copias de index.html por ruta publica (dist/precios/index.html...; scripts/generate-static-meta.mjs)
    "~/index\.html$"        "no-cache";
    /sw.js                  "no-cache";
    /sitemap.xml            "public, max-age=3600";
    /robots.txt             "public, max-age=3600";
    # Vite pone hash en el nombre de todo lo que hay en /assets/
    "~^/assets/"            "public, max-age=31536000, immutable";
    # Resto de estáticos de public/ (sin hash): caché corta
    "~*\.(?:css|js|mjs|json|png|jpe?g|gif|ico|svg|webp|avif|woff2?|ttf|otf|eot|webmanifest|xsl)$"  "public, max-age=86400";
}

# ----------------------------------------------------------------------------------------------
# Redirecciones permanentes (contexto http). Mismo listado que routeRedirects en
# config/routeConfig.ts y getRedirectPath en server.mjs: si cambias uno, cambia los tres.
# - Páginas fusionadas con otra (una sola URL por contenido).
# - Enlaces de la versión antigua con prefijo de idioma (/es/pricing daba 404).
# - NUEVO (auditoría 25/10/2026, hallazgo 12): /recursos y /resources eran una página «en
#   construcción» indexable; ahora redirigen al blog, que es lo que hay en esa sección.
#   (config/routeConfig.ts y server.mjs aún no tienen estas dos entradas: añadirlas allí.)
# - Excepciones (valor vacío = NO redirigir): listado de ofertas por país (/es/empleos, /mx/empleos)
#   y ficha de oferta con país (/es/ofertas/<slug>, /mx/jobs/<slug>): no son prefijos de idioma antiguos.
# En un map, las claves exactas ganan a las regex y las regex se prueban en orden de aparición.
# ----------------------------------------------------------------------------------------------
map $uri $ycp_redirect {
    default                         "";
    /nosotros/mision                /nosotros;
    /about/mission                  /about;
    /recursos/biblioteca            /profesionales/plantillas;
    /resources/library              /professionals/templates;
    /recursos                       /recursos/blog;
    /resources                      /resources/blog;
    "~^/recursos/$"                 /recursos/blog;
    "~^/resources/$"                /resources/blog;
    /es                             /;
    /en                             /;
    /es/pricing                     /precios;
    /es/product/overview            /producto/resumen;
    /es/product/stamps              /producto/sellos;
    /es/product/ats                 /producto/ats;
    /es/product/domain              /producto/dominio;
    /es/product/analytics           /producto/analiticas;
    /es/product/ai                  /producto/ia;
    /es/professionals/how           /profesionales/como-funciona;
    /es/professionals/templates     /profesionales/plantillas;
    /es/professionals/help          /profesionales/ayuda;
    /es/companies/search            /empresas/busqueda;
    /es/companies/plans             /empresas/planes;
    /es/companies/integrations      /empresas/integraciones;
    /es/companies/security          /empresas/seguridad;
    /es/resources                   /recursos/blog;
    /en/resources                   /resources/blog;
    /es/resources/blog              /recursos/blog;
    /es/resources/library           /profesionales/plantillas;
    /es/resources/success-stories   /recursos/exito;
    /es/resources/status            /recursos/estado;
    /es/about                       /nosotros;
    /es/about/mission               /nosotros;
    /es/about/press                 /nosotros/prensa;
    /es/about/contact               /nosotros/contacto;
    /es/jobs                        /empleos;
    # Listado de ofertas por país (/es/empleos, /mx/empleos...): NO es un prefijo de idioma antiguo.
    # Una coincidencia exacta con valor vacío gana a la regex de abajo y no redirige.
    /es/empleos                     "";
    # Ficha de oferta con país (/es/ofertas/<slug>, /mx/jobs/<slug>): tampoco lo es.
    "~^/(?!en/)[a-z]{2}/(?:ofertas|jobs)/[^/]+$"  "";
    /es/terms                       /terminos;
    /es/privacy                     /privacidad;
    # Cualquier otro /es/... o /en/... pierde el prefijo (nginx >= 0.9 permite usar la captura con nombre).
    "~^/(?:es|en)(?<ycp_redirect_rest>/.+)$"  $ycp_redirect_rest;
}

# ----------------------------------------------------------------------------------------------
# LISTA BLANCA de rutas de la aplicación (hallazgo 01, soft 404).
#
# Sin Node, nginx no sabe qué rutas existen; antes `try_files ... /index.html` devolvía 200 para
# CUALQUIER URL (también /esta-pagina-no-existe-xyz, /producto/inexistente, /PRECIOS). Ahora:
#   1) un fichero real (assets, imágenes, robots.txt...)                      -> 200
#   2) una carpeta con copia estática `$uri/index.html` (páginas públicas,
#      artículos del blog y perfiles /cv/<slug> generados en el build)         -> 200
#   3) una ruta de la SPA que NO tiene copia estática (esta lista)             -> 200 con /index.html
#   4) todo lo demás                                                           -> 404 + /404.html
#
# Sale de config/routeConfig.ts (pathMappings) y de las <Route> de App.tsx. Si añades una ruta a la
# SPA que no tenga copia estática, añádela aquí o nginx responderá 404 aunque la SPA la conozca.
# `node scripts/seo/verificar-nginx-rutas.mjs` comprueba que cada ruta de routeConfig.ts queda cubierta.
#
# DELIBERADAMENTE FUERA de la lista (solo 200 si tienen copia estática, si no 404):
#   /recursos/blog/<slug> y /resources/blog/<slug>  (300 copias generadas en el build)
#   /producto/<x>, /product/<x>, /empresas/<x>, ... que no estén en routeConfig
#   /cv (sin slug), /alertas, /alerts, /api/* (salvo /api/mail-relay), /talent-search, /profiles/<x>
#
# LÍMITE DOCUMENTADO: /cv/<slug>, /<cc>/ofertas/<slug>, /<cc>/jobs/<slug>, /jobs/<slug> y
# /empleos/<slug> existen «por la SPA»: nginx no puede saber si el perfil o la oferta existe, así
# que una inexistente (/cv/no-existe-perfil-xyz123) sigue dando 200 y es la SPA la que pinta el 404
# con noindex. Se resolvería de dos formas:
#   a) `map` generado en el build: scripts/generate-profile-html.mjs ya conoce los slugs de perfil;
#      que escriba además `/etc/nginx/ycp-slugs.map` (`/cv/<slug> 1;` y las fichas de oferta
#      publicadas) y aquí `map $uri $ycp_ficha_existe`; el fallback devolvería 404 si vale 0.
#      Límite: un perfil u oferta publicado después del build daría 404 hasta el siguiente build.
#   b) Edge Function de existencia: `auth_request /_existe;` (ngx_http_auth_request_module) con un
#      `location = /_existe { internal; proxy_pass https://<proyecto>.supabase.co/functions/v1/ficha-existe?ruta=$uri; }`
#      que responda 200/404 según `profiles.slug` / `job_postings`. Siempre al día, pero añade un
#      viaje a Supabase por cada visita a una ficha (se puede cachear con proxy_cache 1-5 min).
# ----------------------------------------------------------------------------------------------
map $uri $ycp_app_route {
    default 0;

    # Autenticación y enlaces de correo (App.tsx). `/auth/` está en robots.txt pero no es ruta.
    "~^/(?:login|signup|magic-link|recovery|callback|confirm)/?$"  1;

    # Áreas privadas (requieren sesión; robots.txt las deshabilita): se sirven enteras a la SPA.
    # `company(?:/|$)` NO coincide con /companies (página pública de routeConfig).
    "~^/(?:dashboard|admin|manager|company)(?:/|$)"  1;

    # Comunidad: listado y publicación individual (App.tsx)
    "~^/(?:feed|comunidad)/?$"                       1;
    "~^/(?:feed|comunidad)/post/[^/]+/?$"            1;
    "~^/p/[^/]+/?$"                                  1;

    # Bolsa de empleo: listado, ficha antigua sin país, listado por país y ficha con país
    # (jobDetailRoutes y /:country/empleos en App.tsx; país = 2 letras, como `[a-z]{2}` en $ycp_redirect).
    "~^/(?:jobs|empleos)/?$"                         1;
    "~^/(?:jobs|empleos)/[^/]+/?$"                   1;
    "~^/[a-z]{2}/empleos/?$"                         1;
    "~^/[a-z]{2}/(?:ofertas|jobs)/[^/]+/?$"          1;
    # Baja de alertas desde el correo (alertUnsubscribeRoutes)
    "~^/(?:alertas/baja|alerts/unsubscribe)/?$"      1;

    # Perfil público (copia estática si existe; si no, la SPA). Ver LÍMITE DOCUMENTADO.
    "~^/cv/[^/]+/?$"                                 1;

    # Páginas de config/routeConfig.ts (pathMappings), ES y EN, una a una. Casi todas tienen copia
    # estática y no llegan aquí; esta lista evita un 404 si el build se dejara alguna.
    # (/recursos y /resources no van: las redirige $ycp_redirect.)
    "~^/(?:product|producto)/?$"                                                                     1;
    "~^/product/(?:overview|stamps|ats|domain|analytics|ai)/?$"                                      1;
    "~^/producto/(?:resumen|sellos|ats|dominio|analiticas|ia)/?$"                                    1;
    "~^/(?:companies|empresas)/?$"                                                                   1;
    "~^/companies/(?:search|plans|integrations|security)/?$"                                         1;
    "~^/empresas/(?:busqueda|planes|integraciones|seguridad)/?$"                                     1;
    "~^/(?:professionals|profesionales)/?$"                                                          1;
    "~^/professionals/(?:how|templates|help)/?$"                                                     1;
    "~^/profesionales/(?:como-funciona|plantillas|ayuda)/?$"                                         1;
    "~^/(?:about|nosotros)/?$"                                                                       1;
    "~^/about/(?:press|contact)/?$"                                                                  1;
    "~^/nosotros/(?:prensa|contacto)/?$"                                                             1;
    "~^/(?:pricing|precios)/?$"                                                                      1;
    "~^/resources/(?:blog|success-stories|status)/?$"                                                1;
    "~^/recursos/(?:blog|exito|estado)/?$"                                                           1;
    "~^/(?:profiles|perfiles)/?$"                                                                    1;
    "~^/(?:terms|terminos|privacy|privacidad|cookie-policy|politica-de-cookies)/?$"                  1;
    # Herramientas internas de desarrollo (robots.txt: Disallow /dev/). Ya se servían así; si no
    # se quieren en producción, borra esta línea y pasarán a 404.
    "~^/dev/(?:template-preview|vista-previa-plantillas|all-templates-preview|todas-plantillas-vista)/?$"  1;
}

# HTTP -> HTTPS (siempre al apex)
server {
    listen 80;
    listen [::]:80;
    server_name yourcvpassport.com www.yourcvpassport.com;
    server_tokens off;

    return 301 https://yourcvpassport.com$request_uri;
}

# HTTPS www -> apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.yourcvpassport.com;
    server_tokens off;

    include snippets/yourcvpassport-ssl.conf;
    include snippets/yourcvpassport-security-headers.conf;

    return 301 https://yourcvpassport.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourcvpassport.com;
    server_tokens off;

    # SSL Configuration (ajusta las rutas del certificado en el snippet)
    include snippets/yourcvpassport-ssl.conf;

    # Cabeceras de seguridad a nivel de server: llegan a TODO (assets, 404, robots, sitemap,
    # errores). NO usar add_header dentro de las location (nginx dejaría de heredar estas).
    include snippets/yourcvpassport-security-headers.conf;
    add_header Cache-Control $ycp_cache_control;

    # Rutas fusionadas, /recursos, /resources y prefijos /es, /en antiguos (map $ycp_redirect).
    # if + return a nivel de server es seguro; conserva la query.
    if ($ycp_redirect) {
        return 301 $ycp_redirect$is_args$args;
    }

    # Raíz del build estático (npm run build -> dist/, subido entero con sus subcarpetas)
    root /var/www/yourcvpassport.com/public/dist;

    client_max_body_size 1m;

    # Logs
    access_log /var/log/nginx/yourcvpassport-access.log;
    error_log /var/log/nginx/yourcvpassport-error.log;

    # Comprimir archivos (woff/woff2 ya van comprimidos)
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml application/rss+xml application/manifest+json image/svg+xml image/x-icon font/ttf font/otf application/vnd.ms-fontobject;

    # ---- BROTLI (hallazgo 10) ------------------------------------------------------------------
    # requiere ngx_brotli (Debian/Ubuntu: libnginx-mod-http-brotli-filter; otras: compilar
    # github.com/google/ngx_brotli y `load_module modules/ngx_http_brotli_filter_module.so;` en
    # nginx.conf). SIN el módulo, `nginx -t` falla con «unknown directive "brotli"» y no se recarga
    # nada (el nginx en marcha no se toca). Si no vas a instalarlo, comenta las 4 líneas de abajo
    # (o activa Brotli en Cloudflare y deja solo gzip aquí). El navegador elige br o gzip con
    # Accept-Encoding; gzip_vary on ya añade Vary: Accept-Encoding.
    brotli on;
    brotli_comp_level 5;
    brotli_min_length 1000;
    brotli_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml application/rss+xml application/manifest+json image/svg+xml image/x-icon font/ttf font/otf application/vnd.ms-fontobject;
    # ---- FIN BROTLI ----------------------------------------------------------------------------

    # Página de error estática para TODOS los 404 (también los de `try_files ... =404`).
    # Sin `=`: conserva el código 404 (con `= 200` volvería a ser un soft 404).
    error_page 404 /404.html;

    # public/404.html (noindex, bilingüe, sin JS). `internal`: pedirla directamente da 404,
    # no 200; si fuera pública sería una página indexable con código 200.
    location = /404.html {
        internal;
    }

    # Denegar acceso a archivos ocultos (.env, .git...), salvo /.well-known/ (ACME, etc.).
    # Va antes que las demás location por regex: la primera que coincide gana.
    location ~ /\.(?!well-known/) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # `/index.html` y `/<ruta>/index.html` son el mismo contenido que `/` y `/<ruta>` (duplicados con
    # código 200). Se redirigen con 301 a la URL limpia. El fallback de la SPA (@ycp_app) usa
    # `rewrite ... break` y NO vuelve a pasar por aquí; `try_files $uri/index.html` tampoco.
    location = /index.html {
        return 301 /;
    }

    location ~ ^(/.+)/index\.html$ {
        return 301 $1$is_args$args;
    }

    # Assets con hash de Vite (^~: tiene prioridad sobre las regex)
    location ^~ /assets/ {
        access_log off;
        try_files $uri =404;
    }

    # Resto de estáticos
    location ~* \.(?:js|mjs|css|png|jpe?g|gif|ico|svg|webp|avif|woff2?|ttf|otf|eot)$ {
        access_log off;
        try_files $uri =404;
    }

    # mime.types de nginx no conoce .webmanifest
    location = /site.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    # /sitemap.xml lo genera la Edge Function `sitemap` de Supabase (blog, perfiles y fichas al día).
    # Se copia el host del proyecto de CSP/index.html (djehzlzombqrzzuchcef). Si la función está
    # desplegada CON verify_jwt, hay que enviar la cabecera `apikey` con la anon key (pública: es la
    # misma del bundle); descomenta y rellena la línea, o copia de /etc/nginx/sites-available/
    # yourcvpassport.com la que ya tenga. No se pega aquí ninguna clave.
    # Si Supabase falla (500/502/503/504) o rechaza la petición (401/403: falta la cabecera apikey) se sirve
    # dist/sitemap.xml, el que genera el build, en vez de dar un error a Google.
    # Nota: con un host literal nginx resuelve la IP al arrancar/recargar; si Supabase la cambiara,
    # `systemctl reload nginx` (o usa `set $host_sm ...; resolver ...;` con proxy_pass por variable).
    location = /sitemap.xml {
        proxy_pass https://djehzlzombqrzzuchcef.supabase.co/functions/v1/sitemap;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host djehzlzombqrzzuchcef.supabase.co;
        proxy_set_header Connection "";
        # proxy_set_header apikey "<ANON_KEY_PUBLICA>";
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;

        # La caché y las cabeceras de seguridad las pone este server; así no salen duplicadas
        proxy_hide_header Cache-Control;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header X-XSS-Protection;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Security-Policy-Report-Only;

        proxy_intercept_errors on;
        error_page 401 403 500 502 503 504 = @ycp_sitemap_estatico;
        access_log off;
    }

    location @ycp_sitemap_estatico {
        rewrite ^ /sitemap.xml break;
    }

    # Relé de correo hacia Brevo (deploy/mail-relay/README.md): las Edge Functions envían aquí porque
    # solo la IP de este servidor está autorizada en Brevo. Sin cambios respecto a producción.
    location = /api/mail-relay {
        proxy_pass http://127.0.0.1:3917/;
        proxy_set_header Host $host;
        client_max_body_size 512k;
    }

    # Archivos especiales
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Resto de rutas: fichero real -> copia estática `$uri/index.html` -> SPA (si está en la lista
    # blanca) -> 404. `$uri/index.html` y no `$uri/`: con `$uri/` nginx respondería 301 de /precios a
    # /precios/ (la carpeta de generate-static-meta existe) y el canonical, el hreflang y el sitemap
    # apuntan a /precios (auditoría 15/10/2026: 159 URLs del sitemap redirigían).
    location / {
        try_files $uri $uri/index.html @ycp_app;
    }

    location @ycp_app {
        # Ruta desconocida: 404 real, con /404.html (error_page de arriba)
        if ($ycp_app_route = 0) {
            return 404;
        }
        # Ruta de la SPA sin copia estática: se sirve /index.html con 200. `break` mantiene la
        # petición aquí (sin re-evaluar las location, y por tanto sin el 301 de /index.html).
        rewrite ^ /index.html break;
    }
}
