# YourCVPassport - Nginx Configuration con SSR OBLIGATORIO
# Configuración para producción con códigos HTTP 404 reales del servidor
# TODAS las peticiones pasan por el servidor Node.js SSR

upstream nodejs_backend {
    server 127.0.0.1:3001;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name yourcvpassport.com www.yourcvpassport.com;

    # Redireccionar HTTP a HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourcvpassport.com www.yourcvpassport.com;

    # SSL Configuration (ajusta las rutas según tu certificado)
    ssl_certificate /etc/ssl/certs/yourcvpassport.crt;
    ssl_certificate_key /etc/ssl/private/yourcvpassport.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Root directory
    root /var/www/yourcvpassport/dist;

    # Logs
    access_log /var/log/nginx/yourcvpassport-access.log;
    error_log /var/log/nginx/yourcvpassport-error.log;

    # Comprimir archivos
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Archivos estáticos - Servir directamente sin SSR
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/yourcvpassport/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Assets folder - Servir directamente
    location /assets/ {
        root /var/www/yourcvpassport/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Health check - Directo a Node.js
    location = /health {
        proxy_pass http://nodejs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Archivos especiales - Servir directamente
    location = /robots.txt {
        root /var/www/yourcvpassport/dist;
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico {
        root /var/www/yourcvpassport/dist;
        access_log off;
        log_not_found off;
    }

    location = /sitemap.xml {
        root /var/www/yourcvpassport/dist;
        access_log off;
        log_not_found off;
    }

    # Denegar acceso a archivos ocultos
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Bloquear rutas no implementadas - 404 directo desde nginx
    location ~ ^/(profiles|perfiles)/ {
        return 404;
    }

    location = /talent-search {
        return 404;
    }

    # TODAS las demás rutas - Proxy a Node.js SSR (OBLIGATORIO)
    location / {
        # Proxy a Node.js para SSR
        proxy_pass http://nodejs_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # CRÍTICO: Preservar el código de estado del backend
        proxy_intercept_errors on;

        # Headers de seguridad
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
