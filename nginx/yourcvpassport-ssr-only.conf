# YourCVPassport - Nginx Configuration con SSR OBLIGATORIO
# Configuración para producción con códigos HTTP 404 reales del servidor
# TODAS las peticiones que no son archivos estáticos pasan por el servidor Node.js
# (server.mjs o nginx/ssr-server-example.js, ambos en el puerto 3001 por defecto).
#
# Requiere los snippets de este directorio en /etc/nginx/snippets/ (ver nginx/README.md):
#   yourcvpassport-ssl.conf, yourcvpassport-security-headers.conf, yourcvpassport-proxy.conf
# Habilitar SOLO uno de los dos sites (este o yourcvpassport-with-ssr.conf): ambos
# definen el upstream y los map.
#
# Canónico: https://yourcvpassport.com (APEX). http y www redirigen ahí con 301.

# Caché por URI de lo que sirve nginx directamente (contexto http). Lo que viene de
# Node cae en "default" y conserva el Cache-Control que pone Node.
map $uri $ycp_cache_control {
    default                 "";
    /index.html             "no-cache";
    /sw.js                  "no-cache";
    /sitemap.xml            "public, max-age=3600";
    /robots.txt             "public, max-age=3600";
    # Vite pone hash en el nombre de todo lo que hay en /assets/
    "~^/assets/"            "public, max-age=31536000, immutable";
    # Resto de estáticos de public/ (sin hash): caché corta
    "~*\.(?:css|js|mjs|json|png|jpe?g|gif|ico|svg|webp|avif|woff2?|ttf|otf|eot|webmanifest|xsl)$"  "public, max-age=86400";
}

upstream nodejs_backend {
    # Mismo puerto que server.mjs (PORT, 3001 por defecto; HOST 127.0.0.1)
    server 127.0.0.1:3001;
    keepalive 64;
}

# HTTP -> HTTPS (siempre al apex)
server {
    listen 80;
    listen [::]:80;
    server_name yourcvpassport.com www.yourcvpassport.com;
    server_tokens off;

    return 301 https://yourcvpassport.com$request_uri;
}

# HTTPS www -> apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.yourcvpassport.com;
    server_tokens off;

    include snippets/yourcvpassport-ssl.conf;
    include snippets/yourcvpassport-security-headers.conf;

    return 301 https://yourcvpassport.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourcvpassport.com;
    server_tokens off;

    # SSL Configuration (ajusta las rutas del certificado en el snippet)
    include snippets/yourcvpassport-ssl.conf;

    # Cabeceras de seguridad a nivel de server: llegan a TODO (assets, robots, sitemap,
    # errores y respuestas de Node). NO usar add_header dentro de las location.
    include snippets/yourcvpassport-security-headers.conf;
    add_header Cache-Control $ycp_cache_control;

    # Root directory
    root /var/www/yourcvpassport/dist;

    client_max_body_size 1m;

    # Logs
    access_log /var/log/nginx/yourcvpassport-access.log;
    error_log /var/log/nginx/yourcvpassport-error.log;

    # Comprimir archivos (woff/woff2 ya van comprimidos)
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml application/rss+xml application/manifest+json image/svg+xml image/x-icon font/ttf font/otf application/vnd.ms-fontobject;

    # Denegar acceso a archivos ocultos (.env, .git...), salvo /.well-known/ (ACME, etc.).
    # Va antes que las demás location por regex: la primera que coincide gana.
    location ~ /\.(?!well-known/) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Assets con hash de Vite - Servir directamente (^~: prioridad sobre las regex)
    location ^~ /assets/ {
        access_log off;
        try_files $uri =404;
    }

    # Archivos estáticos - Servir directamente sin SSR
    location ~* \.(?:js|mjs|css|png|jpe?g|gif|ico|svg|webp|avif|woff2?|ttf|otf|eot)$ {
        access_log off;
        try_files $uri =404;
    }

    # mime.types de nginx no conoce .webmanifest
    location = /site.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    # Health check - Directo a Node.js
    location = /health {
        include snippets/yourcvpassport-proxy.conf;
        proxy_pass http://nodejs_backend;
        access_log off;
    }

    # Archivos especiales - Servir directamente
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /sitemap.xml {
        access_log off;
        log_not_found off;
    }

    # Bloquear rutas no implementadas - 404 directo desde nginx
    location ~ ^/(profiles|perfiles)/ {
        return 404;
    }

    location = /talent-search {
        return 404;
    }

    # TODAS las demás rutas - Proxy a Node.js SSR (OBLIGATORIO).
    # El código de estado y el HTML de Node (p. ej. 404 de perfil inexistente) llegan tal cual.
    location / {
        include snippets/yourcvpassport-proxy.conf;
        # Si Node no responde, se sirve la SPA estática en vez de un 502
        error_page 502 503 504 = @spa_fallback;
        proxy_pass http://nodejs_backend;
    }

    location @spa_fallback {
        try_files /index.html =503;
    }
}
