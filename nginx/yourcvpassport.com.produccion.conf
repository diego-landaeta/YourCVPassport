# YourCVPassport - yourcvpassport.com
# Actualizado el 29/10/2026 (404 real, auditoria SEO 25/10) y antes el 16/10/2026 (auditoría issue #11). Copia anterior al lado:
# yourcvpassport.com.bak-<fecha>. Cambios respecto a la anterior:
#   - www -> dominio sin www con 301 (antes www servía la web: contenido duplicado).
#   - try_files $uri/index.html en vez de $uri/: con $uri/ nginx respondía 301 de
#     /precios a /precios/ (carpetas de seo/static-meta), y canonical, hreflang y
#     sitemap apuntan a /precios.
#   - Cabeceras de seguridad (snippets/yourcvpassport-headers.conf) y server_tokens off.
#   - HTML con Cache-Control no-cache: tras un despliegue nadie se queda con el
#     index.html viejo. Los assets llevan hash y siguen con caché de 1 año.

# Redirecciones 301 (contexto http). Mismo listado que routeRedirects en
# config/routeConfig.ts del repo: paginas fusionadas y enlaces antiguos con prefijo /es o /en.
map $uri $ycp_redirect {
    default                         "";
    /nosotros/mision                /nosotros;
    /about/mission                  /about;
    /recursos/biblioteca            /profesionales/plantillas;
    /resources/library              /professionals/templates;
    /recursos                       /recursos/blog;
    /resources                      /resources/blog;
    "~^/recursos/$"                 /recursos/blog;
    "~^/resources/$"                /resources/blog;
    /es                             /;
    /en                             /;
    /es/pricing                     /precios;
    /es/product/overview            /producto/resumen;
    /es/product/stamps              /producto/sellos;
    /es/product/ats                 /producto/ats;
    /es/product/domain              /producto/dominio;
    /es/product/analytics           /producto/analiticas;
    /es/product/ai                  /producto/ia;
    /es/professionals/how           /profesionales/como-funciona;
    /es/professionals/templates     /profesionales/plantillas;
    /es/professionals/help          /profesionales/ayuda;
    /es/companies/search            /empresas/busqueda;
    /es/companies/plans             /empresas/planes;
    /es/companies/integrations      /empresas/integraciones;
    /es/companies/security          /empresas/seguridad;
    /es/resources/blog              /recursos/blog;
    /es/resources/library           /profesionales/plantillas;
    /es/resources/success-stories   /recursos/exito;
    /es/resources/status            /recursos/estado;
    /es/about                       /nosotros;
    /es/about/mission               /nosotros;
    /es/about/press                 /nosotros/prensa;
    /es/about/contact               /nosotros/contacto;
    /es/jobs                        /empleos;
    /es/terms                       /terminos;
    /es/privacy                     /privacidad;
    # Listado y fichas de ofertas por pais (/es/empleos, /mx/jobs/<slug>): no son prefijos de idioma antiguos.
    /es/empleos                     "";
    "~^/(?!en/)[a-z]{2}/(?:ofertas|jobs)/[^/]+$"  "";
    "~^/(?:es|en)(?<ycp_redirect_rest>/.+)$"  $ycp_redirect_rest;
}

# Rutas de la aplicacion (SPA) sin copia estatica: el resto de URLs desconocidas dan 404 real.
# Auditoria SEO 25/10/2026, hallazgo 01. Lista generada desde config/routeConfig.ts (ver nginx/README-static.md).
map $uri $ycp_app_route {
    default 0;

    # Autenticación y enlaces de correo (App.tsx). `/auth/` está en robots.txt pero no es ruta.
    "~^/(?:login|signup|magic-link|recovery|callback|confirm)/?$"  1;

    # Áreas privadas (requieren sesión; robots.txt las deshabilita): se sirven enteras a la SPA.
    # `company(?:/|$)` NO coincide con /companies (página pública de routeConfig).
    "~^/(?:dashboard|admin|manager|company)(?:/|$)"  1;

    # Comunidad: listado y publicación individual (App.tsx)
    "~^/(?:feed|comunidad)/?$"                       1;
    "~^/(?:feed|comunidad)/post/[^/]+/?$"            1;
    "~^/p/[^/]+/?$"                                  1;

    # Bolsa de empleo: listado, ficha antigua sin país, listado por país y ficha con país
    # (jobDetailRoutes y /:country/empleos en App.tsx; país = 2 letras, como `[a-z]{2}` en $ycp_redirect).
    "~^/(?:jobs|empleos)/?$"                         1;
    "~^/(?:jobs|empleos)/[^/]+/?$"                   1;
    "~^/[a-z]{2}/empleos/?$"                         1;
    "~^/[a-z]{2}/(?:ofertas|jobs)/[^/]+/?$"          1;
    # Baja de alertas desde el correo (alertUnsubscribeRoutes)
    "~^/(?:alertas/baja|alerts/unsubscribe)/?$"      1;

    # Perfil público (copia estática si existe; si no, la SPA). Ver LÍMITE DOCUMENTADO.
    "~^/cv/[^/]+/?$"                                 1;

    # Páginas de config/routeConfig.ts (pathMappings), ES y EN, una a una. Casi todas tienen copia
    # estática y no llegan aquí; esta lista evita un 404 si el build se dejara alguna.
    # (/recursos y /resources no van: las redirige $ycp_redirect.)
    "~^/(?:product|producto)/?$"                                                                     1;
    "~^/product/(?:overview|stamps|ats|domain|analytics|ai)/?$"                                      1;
    "~^/producto/(?:resumen|sellos|ats|dominio|analiticas|ia)/?$"                                    1;
    "~^/(?:companies|empresas)/?$"                                                                   1;
    "~^/companies/(?:search|plans|integrations|security)/?$"                                         1;
    "~^/empresas/(?:busqueda|planes|integraciones|seguridad)/?$"                                     1;
    "~^/(?:professionals|profesionales)/?$"                                                          1;
    "~^/professionals/(?:how|templates|help)/?$"                                                     1;
    "~^/profesionales/(?:como-funciona|plantillas|ayuda)/?$"                                         1;
    "~^/(?:about|nosotros)/?$"                                                                       1;
    "~^/about/(?:press|contact)/?$"                                                                  1;
    "~^/nosotros/(?:prensa|contacto)/?$"                                                             1;
    "~^/(?:pricing|precios)/?$"                                                                      1;
    "~^/resources/(?:blog|success-stories|status)/?$"                                                1;
    "~^/recursos/(?:blog|exito|estado)/?$"                                                           1;
    "~^/(?:profiles|perfiles)/?$"                                                                    1;
    "~^/(?:terms|terminos|privacy|privacidad|cookie-policy|politica-de-cookies)/?$"                  1;
    # Herramientas internas de desarrollo (robots.txt: Disallow /dev/). Ya se servían así; si no
    # se quieren en producción, borra esta línea y pasarán a 404.
    "~^/dev/(?:template-preview|vista-previa-plantillas|all-templates-preview|todas-plantillas-vista)/?$"  1;
}

# HTTP -> HTTPS, siempre al dominio sin www
server {
    listen 80;
    listen [::]:80;
    server_name yourcvpassport.com www.yourcvpassport.com;
    server_tokens off;
    return 301 https://yourcvpassport.com$request_uri;
}

# HTTPS www -> sin www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.yourcvpassport.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/yourcvpassport.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/yourcvpassport.com/privkey.pem; # managed by Certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 301 https://yourcvpassport.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourcvpassport.com;
    server_tokens off;

    # Rutas fusionadas y prefijos /es, /en antiguos (map $ycp_redirect).
    if ($ycp_redirect) {
        return 301 $ycp_redirect$is_args$args;
    }

    ssl_certificate /etc/letsencrypt/live/yourcvpassport.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/yourcvpassport.com/privkey.pem; # managed by Certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/yourcvpassport.com/public/dist;
    index index.html;

    access_log /var/log/nginx/yourcvpassport-access.log;
    error_log /var/log/nginx/yourcvpassport-error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Cabeceras de seguridad. Se repiten (include) en cada location que tenga su
    # propio add_header, porque nginx no hereda add_header del server en ese caso.
    include snippets/yourcvpassport-headers.conf;

    location = /sitemap.xml {
        proxy_pass https://djehzlzombqrzzuchcef.supabase.co/functions/v1/sitemap;
        proxy_set_header Host djehzlzombqrzzuchcef.supabase.co;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        # Cabeceras propias de Supabase que no deben salir con nuestro dominio
        # (HSTS con includeSubDomains/preload, cookie __cf_bm, sb-*, x-deno-*).
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Content-Type;
        proxy_hide_header sb-gateway-version;
        proxy_hide_header sb-project-ref;
        proxy_hide_header sb-request-id;
        proxy_hide_header x-deno-execution-id;
        proxy_hide_header x-sb-edge-region;
        proxy_hide_header x-served-by;
        add_header Content-Type "application/xml; charset=utf-8";
        include snippets/yourcvpassport-headers.conf;
    }

    location = /api/mail-relay {
        proxy_pass http://127.0.0.1:3917/;
        proxy_set_header Host $host;
        client_max_body_size 512k;
    }

    # 404 real (auditoria SEO 25/10/2026, hallazgo 01). Sin 'internal' no: la pagina es interna.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # /index.html y /<ruta>/index.html duplican a / y /<ruta>: 301 a la URL limpia.
    location = /index.html {
        return 301 /;
    }
    location ~ ^(/.+)/index.html$ {
        return 301 $1$is_args$args;
    }

    # Páginas (HTML): fichero real -> copia estática $uri/index.html -> SPA (lista blanca) -> 404.
    location / {
        try_files $uri $uri/index.html @ycp_app;
        add_header Cache-Control "no-cache" always;
        include snippets/yourcvpassport-headers.conf;
    }

    location @ycp_app {
        if ($ycp_app_route = 0) {
            return 404;
        }
        rewrite ^ /index.html break;
        add_header Cache-Control "no-cache" always;
        include snippets/yourcvpassport-headers.conf;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include snippets/yourcvpassport-headers.conf;
    }

    location ~ /\. {
        deny all;
    }
}
