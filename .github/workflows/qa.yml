name: QA (tipos y Playwright)

# Comprobaciones sin secretos y sin tocar produccion:
# - tsc --noEmit
# - specs antiguos de tests/*.spec.ts (config raiz, Supabase mockeado)
# - suite QA tests/qa en Chromium, SOLO los *.local.spec.ts (Supabase mockeado).
#   Los *.prod.spec.ts (GET contra produccion) no se ejecutan en CI.
# Ver tests/qa/README.md.

on:
  pull_request:
  push:
    branches:
      - main
      - 'trabajo/**'

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium

      - name: Comprobar tipos
        id: tipos
        run: npx tsc --noEmit

      - name: Specs de la config raiz (Supabase mockeado)
        run: npx playwright test

      - name: Suite QA local en Chromium (sin *.prod.spec.ts)
        # Se ejecuta aunque falle el paso anterior: asi el informe trae las dos suites.
        if: ${{ !cancelled() && steps.tipos.outcome == 'success' }}
        # Contra el servidor de desarrollo de Vite: varios specs importan modulos por su ruta
        # de codigo fuente (import('/utils/pdfGenerator.ts')), que solo existe en dev.
        # El spec de SEO va aparte, contra el build (paso siguiente).
        run: npx playwright test -c tests/qa/playwright.qa.config.ts --project=chromium '^(?!.*u09-seo).*local\.spec\.ts$'

      - name: Suite QA de SEO contra el build de produccion
        # En dev, Helmet a veces no pinta canonical/hreflang y estos specs agotan el tiempo.
        # El config reutiliza el servidor que ya escucha en el puerto 5300.
        if: ${{ !cancelled() && steps.tipos.outcome == 'success' }}
        run: |
          npm run build
          npx vite preview --host 127.0.0.1 --port 5300 --strictPort &
          npx wait-on http://127.0.0.1:5300 --timeout 60000
          npx playwright test -c tests/qa/playwright.qa.config.ts --project=chromium 'u09-seo\.local\.spec\.ts'

      - name: Subir informe de Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
